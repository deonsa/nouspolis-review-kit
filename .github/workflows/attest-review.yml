name: Attest NousPolis Review

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  attest-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate completed review
        run: python scripts/validate_review.py

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign review
        run: |
          cosign sign-blob --yes --bundle review/N1_CANDIDATE_REVIEW.sigstore.json review/N1_CANDIDATE_REVIEW.json

      - name: Verify review signature
        run: |
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/attest-review.yml@${GITHUB_REF}"
          cosign verify-blob --bundle review/N1_CANDIDATE_REVIEW.sigstore.json --certificate-identity "$IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" review/N1_CANDIDATE_REVIEW.json

      - name: Build attestation metadata
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/attest-review.yml@${{ github.ref }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          rp = Path('review/N1_CANDIDATE_REVIEW.json')
          mp = Path('target/TARGET_MANIFEST.json')
          bp = Path('review/N1_CANDIDATE_REVIEW.sigstore.json')
          review = json.loads(rp.read_text())
          manifest = json.loads(mp.read_text())
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          out = {
            'attestation_type': 'NOUSPOLIS_N1_REVIEW_AUTHORITY_SIGSTORE',
            'created_at': datetime.now(timezone.utc).isoformat(),
            'target_repository': manifest['target_repository'],
            'target_commit': manifest['target_commit'],
            'target_manifest_sha256': digest(mp),
            'review_id': review['review_id'],
            'review_sha256': digest(rp),
            'review_disposition': review['disposition'],
            'reviewer_principal': os.environ['GITHUB_REPOSITORY_OWNER'],
            'reviewer_repository': os.environ['GITHUB_REPOSITORY'],
            'certificate_identity': os.environ['CERTIFICATE_IDENTITY'],
            'certificate_oidc_issuer': 'https://token.actions.githubusercontent.com',
            'sigstore_bundle_sha256': digest(bp),
            'workflow_run': os.environ['RUN_URL']
          }
          Path('review/REVIEWER_ATTESTATION.json').write_text(json.dumps(out, indent=2) + '\n')
          PY

      - name: Upload review attestation
        uses: actions/upload-artifact@v4
        with:
          name: nouspolis-review-attestation
          path: |
            target/TARGET_MANIFEST.json
            review/N1_CANDIDATE_REVIEW.json
            review/N1_CANDIDATE_REVIEW.sigstore.json
            review/REVIEWER_ATTESTATION.json
